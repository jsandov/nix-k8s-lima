# kind cluster for the local Claude Code AI gateway (`ai-gw-up`).
#
# The node image is PINNED below Envoy Gateway v1.8's supported Kubernetes ceiling
# (v1.35). kind v0.32.0's DEFAULT node image is k8s v1.36.x — ABOVE that ceiling —
# so relying on the default silently runs an unsupported/untested version.
#
# TODO(repro): pin the sha256 digest for byte-reproducible clusters, i.e.
#   image: kindest/node:v1.35.5@sha256:<digest-from-kind-v0.32.0-release-notes>
# (left as a tag here; grab the digest from https://github.com/kubernetes-sigs/kind/releases)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-gw
nodes:
  - role: control-plane
    image: kindest/node:v1.35.5
